name: Build release APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          F="$RUNNER_TEMP/release.jks"
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$F"
          else
            echo "::warning::No signing secrets found, using a temporary key. Each build then has a different signature, so uninstall the old app before installing a new one."
            KSP=ashulock; KA=ashulock; KP=ashulock
            keytool -genkeypair -keystore "$F" -storepass "$KSP" -keypass "$KP" -alias "$KA" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ashu AppLock"
          fi
          { echo "KEYSTORE_FILE=$F"; echo "KEYSTORE_PASSWORD=$KSP"; echo "KEY_ALIAS=$KA"; echo "KEY_PASSWORD=$KP"; } >> "$GITHUB_ENV"
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AshuLock-release-apk, path: app/build/outputs/apk/release/*.apk }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: app/build/outputs/apk/release/*.apk }
